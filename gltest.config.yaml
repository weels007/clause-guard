networks:
  default: localnet

  localnet:
    url: "http://127.0.0.1:4000/api"

  studionet:
    # Accounts are generated per run by default, which means a balance sent to
    # a previous run's address cannot be spent by the next one.
    #
    # To pin the signer (so funding an address is meaningful), create three
    # throwaway keys, add them as repository secrets, and uncomment:
    #
    # accounts:
    #   - "${CLAUSEGUARD_TEST_KEY}"
    #   - "${CLAUSEGUARD_STRANGER_KEY}"
    #   - "${CLAUSEGUARD_PAYEE_KEY}"
    # from: "${CLAUSEGUARD_TEST_KEY}"

paths:
  contracts: "contracts"

environment: .env
