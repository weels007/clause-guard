name: Integration (studionet)

# Deliberately manual: these tests deploy to studionet, pay for real execution,
# and depend on live web fetch and live LLM consensus. Run them when a contract
# change is ready for a real-network check, not on every push.
#
# Accounts are generated by the gltest framework; no secrets are needed here.

on:
  workflow_dispatch:

jobs:
  studionet:
    name: Studio-mode tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: gltest tests/integration/ -v -s --network studionet
