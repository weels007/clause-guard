name: Integration (studionet)

# Real-network check: deploys ClauseGuard to studionet and exercises every
# method, including the adversarial ones. It costs live web fetch and live LLM
# consensus, so it runs when the contract changes, not on every push.
#
# Accounts are generated by the gltest framework; no secrets are needed here.

on:
  push:
    # The contract, the suite that drives it, and the wallet loader it needs.
    # Each run is a single deploy, so a test change is worth one run.
    paths:
      - "contracts/**"
      - "tests/integration/**"
      - "scripts/**"
      - ".github/workflows/integration.yml"
  workflow_dispatch:

jobs:
  studionet:
    name: Studio-mode tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest tests/integration -v -s
        env:
          # Optional: set these to stop relying on the committed password files.
          CLAUSEGUARD_TESTER1_PASSWORD: ${{ secrets.CLAUSEGUARD_TESTER1_PASSWORD }}
          CLAUSEGUARD_TESTER2_PASSWORD: ${{ secrets.CLAUSEGUARD_TESTER2_PASSWORD }}
