name: Integration (studionet)

# Real-network check: deploys ClauseGuard to studionet and exercises every
# method, including the adversarial ones. It costs live web fetch and live LLM
# consensus, so it runs when the contract changes, not on every push.
#
# Accounts are generated by the gltest framework; no secrets are needed here.

on:
  push:
    paths:
      - "contracts/**"
      - "tests/integration/**"
      - "gltest.config.yaml"
      - "requirements.txt"
      - ".github/workflows/integration.yml"
  workflow_dispatch:

jobs:
  studionet:
    name: Studio-mode tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: gltest tests/integration/ -v -s --network studionet
        env:
          # Optional: pin the signers by uncommenting the accounts block in
          # gltest.config.yaml and adding these repository secrets.
          CLAUSEGUARD_TEST_KEY: ${{ secrets.CLAUSEGUARD_TEST_KEY }}
          CLAUSEGUARD_STRANGER_KEY: ${{ secrets.CLAUSEGUARD_STRANGER_KEY }}
          CLAUSEGUARD_PAYEE_KEY: ${{ secrets.CLAUSEGUARD_PAYEE_KEY }}
