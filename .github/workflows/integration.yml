name: Integration (studionet)

# Real-network check: deploys ClauseGuard to studionet and exercises every
# method, including the adversarial ones. It costs live web fetch and live LLM
# consensus, so it runs when the contract changes, not on every push.
#
# Accounts are generated by the gltest framework; no secrets are needed here.

on:
  push:
    paths:
      - "contracts/**"
      - "tests/integration/**"
      - "scripts/**"
      - "gltest.config.yaml"
      - "requirements.txt"
      - ".github/workflows/integration.yml"
  workflow_dispatch:

jobs:
  studionet:
    name: Studio-mode tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Pin the committed test keystores
        run: python scripts/pin_test_accounts.py
        env:
          # Optional: set these secrets to stop relying on the committed
          # password files.
          CLAUSEGUARD_TEST1_PASSWORD: ${{ secrets.CLAUSEGUARD_TEST1_PASSWORD }}
          CLAUSEGUARD_TEST2_PASSWORD: ${{ secrets.CLAUSEGUARD_TEST2_PASSWORD }}
      - run: gltest tests/integration/ -v -s --network studionet
