name: Secrets check

# Reports whether the CI secrets are present, as booleans only — no value is
# ever printed. Use it before untracking the wallet files: every job that signs
# with the tester wallets reads them from these secrets.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/secrets-check.yml"

permissions:
  contents: read

jobs:
  report:
    name: Report secret presence
    runs-on: ubuntu-latest
    steps:
      - name: Presence (booleans only)
        run: |
          echo "CLAUSEGUARD_TESTER1_KEYSTORE set: ${{ secrets.CLAUSEGUARD_TESTER1_KEYSTORE != '' }}"
          echo "CLAUSEGUARD_TESTER1_PASSWORD set: ${{ secrets.CLAUSEGUARD_TESTER1_PASSWORD != '' }}"
          echo "CLAUSEGUARD_TESTER2_KEYSTORE set: ${{ secrets.CLAUSEGUARD_TESTER2_KEYSTORE != '' }}"
          echo "CLAUSEGUARD_TESTER2_PASSWORD set: ${{ secrets.CLAUSEGUARD_TESTER2_PASSWORD != '' }}"
